<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gol Provável</title>
<meta name="description" content="Previsões de placar e de gols para as principais ligas do mundo, com histórico de acertos.">
<meta name="theme-color" content="#1d5c3f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gol Provável">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6f1; --surface:#ffffff; --ink:#13261d; --muted:#56695e; --line:#d6dfd7;
  --pitch:#1d5c3f; --pitch-soft:#e3eee6; --accent:#d9a800; --miss:#b9c4bc; --bad:#b3412e; --good:#1d7a4c;
  --draw:#8a9a90; --away:#3f6fa0;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1f17; --surface:#122a20; --ink:#e7efe9; --muted:#97ac9f; --line:#24412f;
    --pitch:#46a173; --pitch-soft:#173628; --accent:#f2c94c; --miss:#3a5446; --bad:#e2735e; --good:#5cc28c;
    --draw:#7d9187; --away:#6d9bd0; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;margin:0;line-height:1.05}
button,select,input{font:inherit;color:inherit}
a{color:var(--pitch)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:920px;margin:0 auto;padding:0 1rem calc(6.5rem + env(safe-area-inset-bottom,0px))}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.top .in{max-width:920px;margin:0 auto;padding:.6rem 1rem;display:flex;align-items:center;gap:.8rem}
.logo{width:40px;height:40px;flex:none}
.brand{flex:1;min-width:0}
.brand b{font-family:"Barlow Condensed",sans-serif;font-size:1.5rem;font-weight:800;letter-spacing:-.01em;display:block;line-height:1}
.brand small{color:var(--muted);font-size:.82rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:0;border-radius:10px;padding:.6rem 1rem;font-weight:600;cursor:pointer;background:var(--pitch);color:#fff;display:inline-flex;align-items:center;gap:.45rem;text-decoration:none}
.btn.ghost{background:transparent;color:var(--pitch);border:1.5px solid var(--pitch)}
.btn:disabled{opacity:.6;cursor:wait}
.btn svg{width:18px;height:18px;flex:none}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.banner{max-width:920px;margin:.8rem auto 0;padding:.7rem 1rem;border-radius:10px;background:var(--pitch-soft);font-size:.92rem}
.banner[hidden]{display:none}

/* navegação inferior */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom .in{max-width:920px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bottom a{display:flex;flex-direction:column;align-items:center;gap:.1rem;padding:.5rem .2rem .55rem;text-decoration:none;color:var(--muted);font-size:.78rem;font-weight:600}
nav.bottom a svg{width:22px;height:22px}
nav.bottom a[aria-current="page"]{color:var(--pitch)}

/* cabeçalho de página */
.hero{padding:1.4rem 0 1rem}
.hero .date{color:var(--muted);font-weight:500;margin:0 0 .2rem}
.hero h1{font-size:clamp(2.1rem,7vw,3.4rem);font-weight:800;letter-spacing:-.01em}
.tally{display:flex;align-items:baseline;gap:.6rem;margin-top:.7rem;flex-wrap:wrap}
.tally b{font-family:"Barlow Condensed",sans-serif;font-size:clamp(2.6rem,9vw,4rem);line-height:.9;font-weight:800;color:var(--pitch)}
.tally span{color:var(--muted);max-width:34ch}

/* filtros */
.filters{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));padding:.9rem 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.filters label{display:block;font-weight:600;font-size:.88rem;margin-bottom:.3rem}
select,input[type=search],input[type=text],input[type=password]{width:100%;padding:.55rem .6rem;border:1.5px solid var(--line);border-radius:8px;background:var(--surface)}
input[type=range]{width:100%;accent-color:var(--pitch)}
.thr{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}
.thr output{font-family:"Barlow Condensed",sans-serif;font-size:1.25rem;font-weight:700;color:var(--ink)}

/* jogos */
.group{margin-top:1.4rem}
.group h2{font-size:1.4rem;font-weight:700}
.group .src{color:var(--muted);font-size:.85rem;margin:.15rem 0 .4rem}
.match{border-top:1px solid var(--line);padding:.85rem 0}
.match:last-child{border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:3.3rem 1fr auto;gap:.7rem;align-items:center}
.time{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:1.1rem;color:var(--muted)}
.teams{font-weight:600;font-size:1.03rem;line-height:1.25;min-width:0}
.teams .sub{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.3rem;font-weight:500;font-size:.82rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:.25rem;border-radius:6px;padding:.05rem .45rem;background:var(--pitch-soft);color:var(--ink);font-weight:600}
.chip.res{background:transparent;border:1.5px solid currentColor;font-family:"Barlow Condensed",sans-serif;font-size:.95rem}
.chip.hit{color:var(--good)} .chip.miss{color:var(--bad)}
.pct{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:2rem;line-height:1;text-align:right;min-width:4.4ch}
.pct small{display:block;font-size:.72rem;font-weight:600;color:var(--muted);font-family:"Barlow",sans-serif}
.pct.no{color:var(--muted)}
.hda{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:.55rem 0 0 4rem;background:var(--pitch-soft)}
.hda i{display:block;height:100%}
.hda i:nth-child(1){background:var(--pitch)} .hda i:nth-child(2){background:var(--draw)} .hda i:nth-child(3){background:var(--away)}
.hdal{display:flex;justify-content:space-between;margin:.2rem 0 0 4rem;font-size:.78rem;color:var(--muted)}
details{margin:.45rem 0 0 4rem}
summary{cursor:pointer;color:var(--pitch);font-weight:600;font-size:.88rem;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"+ "} details[open] summary::before{content:"− "}
.det{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.25rem 1.2rem;font-size:.88rem;padding:.5rem 0 .2rem;color:var(--muted)}
.det b{color:var(--ink);font-weight:600}
.form{display:inline-flex;gap:3px;vertical-align:middle}
.form i{font-style:normal;font-weight:700;font-size:.72rem;width:1.35em;height:1.35em;display:inline-grid;place-items:center;border-radius:4px;color:#fff}
.form i.V{background:var(--good)} .form i.E{background:var(--draw)} .form i.D{background:var(--bad)}
.chip.val{background:#f2c94c;color:#13261d}
.pan{display:flex;flex-wrap:wrap;gap:.2rem .7rem;margin:.4rem 0 0 4rem;font-size:.8rem}
.pan span{white-space:nowrap;color:var(--muted)} .pan span.y b{color:var(--good)} .pan span.n b{color:var(--bad)}
.list a .pan{margin:.3rem 0 0}
.filt{font-size:.85rem;color:var(--ink);font-weight:600;margin-top:.2rem}
.injrow{margin:.35rem 0 0 4rem;font-size:.8rem;color:var(--muted);line-height:1.45}
.injrow b{color:var(--ink);font-weight:600}
.injlist{margin:.4rem 0 0;padding:0;list-style:none;font-size:.85rem}
.injlist li{padding:.15rem 0;color:var(--muted)}
.injlist li b{color:var(--ink);font-weight:600}
.tag{font-size:.72rem;font-weight:700;border-radius:4px;padding:0 .3rem;margin-left:.3rem;background:var(--pitch-soft);color:var(--ink)}
.mkline{margin:.15rem 0 0 4rem;font-size:.78rem;color:var(--muted)}
.otbl{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem;min-width:0}
.otbl th,.otbl td{padding:.3rem .35rem;border-bottom:1px solid var(--line);text-align:right}
.otbl th:first-child,.otbl td:first-child{text-align:left}
.otbl td.vp{color:var(--good);font-weight:700}
.note{font-size:.8rem;color:var(--muted);margin:.4rem 0 0}
.chip.up{background:#e5f4e4;color:#14532d} .chip.down{background:#fbebeb;color:#7f1d1d}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .chip.up{background:#173f2a;color:#a7e3bf} :root:not([data-theme="light"]) .chip.down{background:#4a1f1a;color:#f3b3a6} }
.tlist{margin-top:.6rem}
.trow{border-top:1px solid var(--line);padding:.75rem 0}
.trow:last-child{border-bottom:1px solid var(--line)}
.trow .top{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem}
.trow .top b{font-weight:600;font-size:1.02rem}
.trow .top span{color:var(--muted);font-size:.82rem;white-space:nowrap}
.tm{display:grid;grid-template-columns:5.2rem 1fr auto;gap:.15rem .6rem;font-size:.88rem;margin-top:.35rem;align-items:baseline}
.tm .k{color:var(--muted)} .tm .d{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.05rem;text-align:right}
.tm .d.pos{color:var(--good)} .tm .d.neg{color:var(--bad)}
.conf{font-size:.74rem;font-weight:600;border-radius:4px;padding:0 .35rem;margin-left:.35rem;white-space:nowrap}
.conf.c2{background:var(--pitch);color:#fff} .conf.c1{background:var(--pitch-soft);color:var(--ink)}
.formrow{display:flex;flex-wrap:wrap;gap:.3rem 1rem;margin:.5rem 0 0 4rem;font-size:.82rem;color:var(--muted);align-items:center}
.empty{padding:1.2rem 0;color:var(--muted)}

/* histórico e desempenho */
.list a{display:grid;grid-template-columns:1fr auto;gap:.5rem;align-items:center;padding:.8rem 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.list a b{font-weight:600}
.list a span{color:var(--muted);font-size:.88rem}
.list a .rate{font-family:"Barlow Condensed",sans-serif;font-size:1.6rem;font-weight:800;text-align:right}
.seg{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:.35rem .85rem;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pitch);color:#fff;border-color:var(--pitch)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-top:1rem}
.kpi{border-top:3px solid var(--pitch);padding-top:.55rem}
.kpi h3{font-size:1.2rem;font-weight:700}
.kpi .big{font-family:"Barlow Condensed",sans-serif;font-size:2.8rem;font-weight:800;line-height:1}
.kpi p{margin:.2rem 0;color:var(--muted);font-size:.9rem}
.sect{margin-top:1.8rem}
.sect h2{font-size:1.45rem}
.sect>p{color:var(--muted);margin:.3rem 0 0;max-width:70ch;font-size:.94rem}
.tblwrap{overflow-x:auto;margin-top:.6rem}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:460px}
th,td{text-align:right;padding:.45rem .5rem;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted)}

/* ajustes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.1rem;margin-top:1rem}
.card h2{font-size:1.4rem;margin-bottom:.3rem}
.card p{margin:.4rem 0;color:var(--muted);font-size:.94rem;max-width:68ch}
.card ol{margin:.6rem 0;padding-left:1.3rem;font-size:.95rem}
.card ol li{margin:.35rem 0}
.card .actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.8rem}
.ok{color:var(--good);font-weight:600} .err{color:var(--bad);font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.3rem 1rem;font-size:.92rem}
.kv span{color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(5.2rem + env(safe-area-inset-bottom,0px));z-index:8;background:var(--ink);color:var(--bg);padding:.65rem 1rem;border-radius:10px;font-size:.92rem;max-width:min(92vw,520px);box-shadow:0 4px 18px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
[hidden]{display:none!important}
@media (max-width:520px){
  .row{grid-template-columns:2.9rem 1fr auto;gap:.55rem}
  .hda,.hdal,details,.formrow,.mkline,.injrow,.match .pan{margin-left:3.45rem}
  .pct{font-size:1.75rem}
  .btn .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){ .spin svg{animation:none} }
</style>
</head>

<line x1="562.6" y1="581.7" x2="625.6" y2="668.3" stroke="#13261d" stroke-width="13.1" stroke-linecap="round"/><line x1="597.1" y1="755.9" x2="426.9" y2="755.9" stroke="#13261d" stroke-width="13.1" stroke-linecap="round"/><polygon points="398.4,668.3 426.9,755.9 352.4,810.0 277.9,755.9 306.3,668.3" fill="#13261d" stroke="#13261d" stroke-width="7.8" stroke-linejoin="round"/><line x1="461.4" y1="581.7" x2="398.4" y2="668.3" stroke="#13261d" stroke-width="13.1" stroke-linecap="round"/><line x1="306.3" y1="668.3" x2="253.7" y2="506.4" stroke="#13261d" stroke-width="13.1" stroke-linecap="round"/><polygon points="328.2,452.3 253.7,506.4 179.2,452.3 207.7,364.7 299.8,364.7" fill="#13261d" stroke="#13261d" stroke-width="7.8" stroke-linejoin="round"/><line x1="430.0" y1="485.4" x2="328.2" y2="452.3" stroke="#13261d" stroke-width="13.1" stroke-linecap="round"/><line x1="299.8" y1="364.7" x2="437.5" y2="264.6" stroke="#13261d" stroke-width="13.1" stroke-linecap="round"/></g></svg><div class="brand"><b>Gol Provável</b><small id="status">Carregando…</small></div>

<script>
(function(){
"use strict";


/* ================= idioma ================= */
var LANG=(function(){
  var pick; try{ pick=JSON.parse(localStorage.getItem("gp_lang")||'"auto"'); }catch(e){ pick="auto"; }
  if (pick==="pt"||pick==="es"||pick==="en") return pick;
  var n=(navigator.languages&&navigator.languages[0])||navigator.language||"pt";
  n=n.toLowerCase(); return n.indexOf("pt")===0?"pt":(n.indexOf("es")===0?"es":"en");
})();

as cuotas se guardan desde esta versión; los primeros números aparecen uno o dos días después.", "No finished matches with recorded odds yet. Odds are stored from this version on; the first numbers appear a day or two later."], "Ainda não há jogos encerrados com previsão “com desfalques”. A comparação aparece aqui conforme os jogos terminam; com uns 100 jogos já dá para decidir se o ajuste vira o padrão.": ["Todavía no hay partidos terminados con pronóstico “con bajas”. La comparación aparece aquí a medida que terminan los partidos; con unos 100 ya se puede decidir si el ajuste pasa a ser el estándar.", "No finished matches with a “with absences” prediction yet. The comparison appears here as matches finish; with about 100 matches we can decide whether the adjustment becomes the default."], "Ainda não há placares neste período. Os resultados entram automaticamente, em até uma hora depois de cada jogo.": ["Todavía no hay resultados en este período. Entran automáticamente, hasta una hora después de cada partido.", "No results in this period yet. They come in automatically, up to an hour after each match."], "Ajustes": ["Ajustes", "Settings"], "Ambos marcam": ["Ambos marcan", "Both teams to score"], "Ambos marcam: não": ["Ambos marcan: no", "BTTS: no"], "Ambos marcam: sim": ["Ambos marcan: sí", "BTTS: yes"], "Amanhã": ["Mañana", "Tomorrow"], "Apagar chave": ["Borrar clave", "Delete key"], "App": ["App", "App"], "App previa": ["La app preveía", "App predicted"], "App x Mercado": ["App vs. Mercado", "App vs. Market"], "As chances batem com a realidade?": ["¿Las probabilidades coinciden con la realidad?", "Do the chances match reality?"], "Atenção: ": ["Atención: ", "Heads up: "], "Atualizado ": ["Actualizado ", "Updated "], "Atualizando…": ["Actualizando…", "Updating…"], "Atualizar": ["Actualizar", "Refresh"], "Atualização com um toque": ["Actualización con un toque", "One-tap update"], "Até 1 gol (menos de 1,5)": ["Hasta 1 gol (menos de 1,5)", "Up to 1 goal (under 1.5)"], "Até 2 gols (menos de 2,5)": ["Hasta 2 goles (menos de 2,5)", "Up to 2 goals (under 2.5)"], "Automático (idioma do celular)": ["Automático (idioma del móvil)", "Automatic (phone language)"], "Base": ["Base", "Base"], "Busca iniciada. Leva de 2 a 4 minutos; pode continuar usando o app.": ["Búsqueda iniciada. Tarda de 2 a 4 minutos; puedes seguir usando la app.", "Update started. It takes 2 to 4 minutes; you can keep using the app."], "Buscando jogos…": ["Buscando partidos…", "Fetching matches…"], "Cada número mostra quantas vezes aconteceu: 2+ gols conta jogos com 2 gols ou mais, “Favorito venceu” conta as vitórias do time que o app apontou como favorito (empate não conta). Seu filtro: “": ["Cada número muestra cuántas veces ocurrió: 2+ goles cuenta partidos con 2 goles o más, “Ganó el favorito” cuenta las victorias del equipo que la app señaló como favorito (el empate no cuenta). Tu filtro: “", "Each number shows how often it happened: 2+ goals counts matches with 2 or more goals, “Favorite won” counts wins by the team the app picked as favorite (a draw does not count). Your filter: “"], "Cada time recebe uma força de ataque e de defesa calculada com os gols da temporada na competição, separando jogos em casa e fora. Com poucos jogos, os números são puxados para a média da liga, para evitar exageros.": ["Cada equipo recibe una fuerza de ataque y de defensa calculada con los goles de la temporada en la competición, separando partidos en casa y fuera. Con pocos partidos, los números se acercan a la media de la liga para evitar exageraciones.", "Each team gets an attack and defense strength computed from its goals this season in the competition, split into home and away matches. With few matches, the numbers are pulled toward the league average to avoid exaggeration."], "Calculando…": ["Calculando…", "Calculating…"], "Calibração: testes com milhares de jogos mostraram que modelos desse tipo exageram a diferença entre jogos de muitos e de poucos gols. Por isso, o total de gols esperado é puxado 19% em direção à média da liga, o que deixou as chances de 2+, 3+ gols e ambos marcam mais próximas do que acontece de verdade.": ["Calibración: pruebas con miles de partidos mostraron que este tipo de modelo exagera la diferencia entre partidos de muchos y de pocos goles. Por eso, el total de goles esperados se acerca un 19% a la media de la liga, lo que dejó las probabilidades de 2+, 3+ goles y ambos marcan más cerca de lo que ocurre de verdad.", "Calibration: tests on thousands of matches showed that models like this exaggerate the gap between high- and low-scoring matches. So the expected total goals is pulled 19% toward the league average, which brought the 2+, 3+ goals and BTTS chances closer to what really happens."], "Carregando histórico…": ["Cargando historial…", "Loading history…"], "Carregando…": ["Cargando…", "Loading…"], "Casa ": ["Local ", "Home "], "Chance do app × melhor odd (": ["Probabilidad de la app × mejor cuota (", "App chance × best odds ("], "Chance média": ["Probabilidad media", "Average chance"], "Chance mínima": ["Probabilidad mínima", "Minimum chance"], "Chance que o app deu: ": ["Probabilidad que dio la app: ", "Chance the app gave: "], "Chave apagada deste aparelho.": ["Clave borrada de este dispositivo.", "Key deleted from this device."], "Chave de acesso": ["Clave de acceso", "Access key"], "Chave não aceita. Copie de novo e cole aqui.": ["Clave no aceptada. Cópiala de nuevo y pégala aquí.", "Key not accepted. Copy it again and paste it here."], "Chave salva neste aparelho.": ["Clave guardada en este dispositivo.", "Key saved on this device."], "Chegaram placares e jogos novos. ": ["Llegaron resultados y partidos nuevos. ", "New results and matches are in. "], "Cole o código abaixo e toque em Salvar.": ["Pega el código abajo y toca Guardar.", "Paste the code below and tap Save."], "Com desfalques": ["Con bajas", "With absences"], "Com desfalques (experimental): vitória da casa ": ["Con bajas (experimental): victoria local ", "With absences (experimental): home win "], "Com isso o app estima quantos gols cada time deve marcar e calcula a chance de cada placar possível (de 0x0 a 10x10). Uma correção estatística conhecida como Dixon-Coles ajusta a frequência de placares baixos, como 0x0 e 1x1.": ["Con eso la app estima cuántos goles debe marcar cada equipo y calcula la probabilidad de cada resultado posible (de 0-0 a 10-10). Una corrección estadística conocida como Dixon-Coles ajusta la frecuencia de los marcadores bajos, como 0-0 y 1-1.", "From that, the app estimates how many goals each team should score and computes the chance of every possible score (0-0 to 10-10). A statistical correction known as Dixon-Coles adjusts the frequency of low scores such as 0-0 and 1-1."], "Como as previsões são feitas": ["Cómo se hacen los pronósticos", "How predictions are made"], "Como foram as previsões": ["Cómo fueron los pronósticos", "How the predictions went"], "Como foram os sinais de valor (★)": ["Cómo fueron las señales de valor (★)", "How the value signals (★) did"], "Competição": ["Competición", "Competition"], "Competições calculadas": ["Competiciones calculadas", "Competitions computed"], "Competições com dados": ["Competiciones con datos", "Competitions with data"], "Competições com falha": ["Competiciones con fallo", "Competitions with errors"], "Competições com jogos": ["Competiciones con partidos", "Competitions with matches"], "Dados recarregados. O app se atualiza sozinho de hora em hora; para buscar na hora, ative a atualização com um toque em Ajustes.": ["Datos recargados. La app se actualiza sola cada hora; para buscar al momento, activa la actualización con un toque en Ajustes.", "Data reloaded. The app updates itself every hour; to fetch right now, turn on one-tap update in Settings."], "Desfalques ajudam? (experimental)": ["¿Ayudan las bajas? (experimental)", "Do absences help? (experimental)"], "Desfalques de ": ["Bajas de ", "Absences for "], "Desça até o fim, toque em “Generate token” e copie o código que aparece (começa com github_pat_).": ["Baja hasta el final, toca “Generate token” y copia el código que aparece (empieza con github_pat_).", "Scroll to the end, tap “Generate token” and copy the code shown (it starts with github_pat_)."], "Diagnóstico da última atualização": ["Diagnóstico de la última actualización", "Last update diagnostics"], "Em “Permissions”, abra “Repository permissions”, procure “Actions” e escolha “Read and write”.": ["En “Permissions”, abre “Repository permissions”, busca “Actions” y elige “Read and write”.", "Under “Permissions”, open “Repository permissions”, find “Actions” and choose “Read and write”."], "Em “Repository access”, marque “Only select repositories” e escolha o repositório ": ["En “Repository access”, marca “Only select repositories” y elige el repositorio ", "Under “Repository access”, select “Only select repositories” and choose the repository "], "Em “Token name”, escreva: gol-provavel. Em “Expiration”, escolha a opção mais longa.": ["En “Token name”, escribe: gol-provavel. En “Expiration”, elige la opción más larga.", "In “Token name”, type: gol-provavel. In “Expiration”, choose the longest option."], "Empate": ["Empate", "Draw"], "Empate ": ["Empate ", "Draw "], "Erro do app": ["Error de la app", "App error"], "Erro do mercado": ["Error del mercado", "Market error"], "Erro médio (Brier, menor é melhor) nos ": ["Error medio (Brier, menor es mejor) en los ", "Average error (Brier, lower is better) in the "], "Erro médio de cada um (Brier: quanto menor, melhor). Superar o mercado é difícil: as casas são a referência mais precisa que existe.": ["Error medio de cada uno (Brier: cuanto menor, mejor). Superar al mercado es difícil: las casas son la referencia más precisa que existe.", "Average error of each (Brier: lower is better). Beating the market is hard: bookmakers are the most accurate benchmark there is."], "Escalações, lesões e motivação não entram no cálculo. É uma estimativa estatística, não uma garantia. Se for apostar, aposte só o que pode perder.": ["Alineaciones, lesiones y motivación no entran en el cálculo. Es una estimación estadística, no una garantía. Si vas a apostar, apuesta solo lo que puedas perder.", "Line-ups, injuries and motivation are not part of the calculation. It is a statistical estimate, not a guarantee. If you bet, only bet what you can afford to lose."], "Ex.: Flamengo": ["Ej.: Boca Juniors", "E.g.: Arsenal"], "Faixa de chance": ["Rango de probabilidad", "Chance range"], "Falha nos desfalques": ["Fallo en las bajas", "Absences error"], "Favorito (": ["Favorito (", "Favorite ("], "Favorito vence": ["Gana el favorito", "Favorite wins"], "Favorito venceu": ["Ganó el favorito", "Favorite won"], "Favorito: ": ["Favorito: ", "Favorite: "], "Filtros": ["Filtros", "Filters"], "Final ": ["Final ", "Full time "], "Fonte dos dados": ["Fuente de datos", "Data source"], "Fora ": ["Visitante ", "Away "], "Forma de ": ["Forma de ", "Form of "], "Forma recente: além da temporada atual, o app usa a temporada anterior, e cada jogo vale menos conforme envelhece (um jogo de um ano atrás vale metade de um de hoje). Esse ajuste foi escolhido testando 22 temporadas reais de 8 ligas: melhorou todas as previsões, principalmente no começo das temporadas. Os quadradinhos V, E e D mostram os 5 últimos resultados de cada time.": ["Forma reciente: además de la temporada actual, la app usa la anterior, y cada partido pesa menos a medida que envejece (un partido de hace un año vale la mitad que uno de hoy). Este ajuste se eligió probando 22 temporadas reales de 8 ligas: mejoró todos los pronósticos, sobre todo al inicio de las temporadas. Los cuadraditos G, E y P muestran los 5 últimos resultados de cada equipo.", "Recent form: besides the current season, the app uses the previous one, and each match counts less as it ages (a match from a year ago is worth half of one today). This was chosen by testing 22 real seasons from 8 leagues: it improved every prediction, especially early in the season. The W, D and L squares show each team's last 5 results."], "Ganham mais pontos que o previsto": ["Ganan más puntos de lo previsto", "Earn more points than predicted"], "Ganham menos pontos que o previsto": ["Ganan menos puntos de lo previsto", "Earn fewer points than predicted"], "Gols esperados": ["Goles esperados", "Expected goals"], "Gols feitos": ["Goles a favor", "Goals scored"], "Gols por jogo": ["Goles por partido", "Goals per match"], "Gols sofridos": ["Goles en contra", "Goals conceded"], "Histórico": ["Historial", "History"], "Hoje": ["Hoy", "Today"], "Idioma": ["Idioma", "Language"], "Idioma do app": ["Idioma de la app", "App language"], "Informações": ["Información", "Information"], "Instalar no celular ou computador": ["Instalar en el móvil o el ordenador", "Install on phone or computer"], "Instalar o app": ["Instalar la app", "Install the app"], "Instalação, atualização e informações": ["Instalación, actualización e información", "Install, update and info"], "Instale para abrir o Gol Provável direto da tela inicial, como qualquer app.": ["Instálala para abrir Gol Provável desde la pantalla de inicio, como cualquier app.", "Install it to open Gol Provável from your home screen, like any app."], "Jogos": ["Partidos", "Matches"], "Jogos com desfalques": ["Partidos con bajas", "Matches with absences"], "Jogos com odds": ["Partidos con cuotas", "Matches with odds"], "Jogos de amanhã": ["Partidos de mañana", "Tomorrow's matches"], "Jogos de hoje": ["Partidos de hoy", "Today's matches"], "Jogos encontrados amanhã": ["Partidos encontrados mañana", "Matches found tomorrow"], "Jogos encontrados hoje": ["Partidos encontrados hoy", "Matches found today"], "Jogue com responsabilidade. Apostas envolvem risco de perda. Proibido para menores de 18 anos.": ["Juega con responsabilidad. Las apuestas implican riesgo de pérdida. Prohibido para menores de 18 años.", "Gamble responsibly. Betting involves risk of loss. Not for anyone under 18."], "Ler a política de privacidade": ["Leer la política de privacidad", "Read the privacy policy"], "Ligas sem odds (falha)": ["Ligas sin cuotas (fallo)", "Leagues without odds (error)"], "Mais previsíveis": ["Más previsibles", "Most predictable"], "Marcam mais que o previsto": ["Marcan más de lo previsto", "Score more than predicted"], "Marcam menos que o previsto": ["Marcan menos de lo previsto", "Score less than predicted"], "Melhor": ["Mejor", "Better"], "Melhor odd": ["Mejor cuota", "Best odds"], "Mercado": ["Mercado", "Market"], "Mercado: casa ": ["Mercado: local ", "Market: home "], "Mostrar": ["Mostrar", "Show"], "Motivo: ": ["Motivo: ", "Reason: "], "Na fila…": ["En cola…", "Queued…"], "Na simulação da temporada, a diferença é consistente (não parece acaso).": ["En la simulación de la temporada, la diferencia es consistente (no parece azar).", "In the season simulation, the difference is consistent (not likely chance)."], "Nenhum jogo com valor (★) neste mercado. Troque o mercado ou veja mais tarde: as odds são atualizadas a cada 3 horas.": ["Ningún partido con valor (★) en este mercado. Cambia de mercado o mira más tarde: las cuotas se actualizan cada 3 horas.", "No value (★) matches in this market. Change the market or check later: odds update every 3 hours."], "Nenhum jogo passa nesse filtro. Diminua a chance mínima, troque o mercado ou escolha “Todos os jogos do dia”.": ["Ningún partido pasa este filtro. Baja la probabilidad mínima, cambia de mercado o elige “Todos los partidos del día”.", "No match passes this filter. Lower the minimum chance, change the market or choose “All matches of the day”."], "Nenhum jogo registrado para este dia. Toque em Atualizar para buscar.": ["Ningún partido registrado para este día. Toca Actualizar para buscar.", "No matches recorded for this day. Tap Refresh to fetch."], "Nenhum sinal de valor com resultado no período.": ["Ninguna señal de valor con resultado en el período.", "No value signals with a result in this period."], "Nenhuma chave salva.": ["Ninguna clave guardada.", "No key saved."], "No Android, abra este link no Chrome.": ["En Android, abre este enlace en Chrome.", "On Android, open this link in Chrome."], "No computador, use o ícone de instalar na barra de endereço do Chrome ou Edge.": ["En el ordenador, usa el icono de instalar en la barra de direcciones de Chrome o Edge.", "On a computer, use the install icon in the Chrome or Edge address bar."], "Nome do repositório": ["Nombre del repositorio", "Repository name"], "Não consegui carregar os dados. Confira a internet e toque em Atualizar.": ["No pude cargar los datos. Revisa la conexión y toca Actualizar.", "Couldn't load the data. Check your connection and tap Refresh."], "Não consegui iniciar a busca agora. Tente de novo em instantes.": ["No pude iniciar la búsqueda ahora. Inténtalo de nuevo en un momento.", "Couldn't start the update now. Try again in a moment."], "O app calcula, em paralelo, uma previsão que considera os jogadores fora: perde-se metade da parcela de gols dos atacantes ausentes, e goleiro ou zagueiros titulares fora aumentam os gols do adversário. Ainda está em teste: a aba Acertos mostra se ela acerta mais que a previsão base.": ["La app calcula, en paralelo, un pronóstico que tiene en cuenta a los jugadores ausentes: se pierde la mitad de la parte de goles de los atacantes que faltan, y un portero o defensas titulares ausentes aumentan los goles del rival. Todavía está en prueba: la pestaña Aciertos muestra si acierta más que el pronóstico base.", "The app computes, in parallel, a prediction that accounts for missing players: half of the absent attackers' share of goals is lost, and a missing starting goalkeeper or defenders increase the opponent's goals. It is still being tested: the Track record tab shows whether it beats the base prediction."], "O app comparado com as odds das casas": ["La app comparada con las cuotas de las casas", "The app compared with bookmaker odds"], "O app já está instalado neste aparelho.": ["La app ya está instalada en este dispositivo.", "The app is already installed on this device."], "O app já se atualiza sozinho de hora em hora, das 8h à 1h. Se quiser que o botão Atualizar busque jogos e placares na hora, faça isto uma única vez neste aparelho:": ["La app ya se actualiza sola cada hora. Si quieres que el botón Actualizar busque partidos y resultados al momento, haz esto una sola vez en este dispositivo:", "The app already updates itself every hour. If you want the Refresh button to fetch matches and results right away, do this once on this device:"], "O app não pede cadastro, não usa rastreadores nem anúncios.": ["La app no pide registro ni usa rastreadores o anuncios.", "The app needs no sign-up and uses no trackers or ads."], "O que você quer prever": ["Qué quieres pronosticar", "What do you want to predict"], "Odd ": ["Cuota ", "Odds "], "Odds de ": ["Cuotas de ", "Odds from "], "Odds e valor: o app busca as odds de várias casas a cada 3 horas, remove a margem de cada uma e usa a mediana como “chance do mercado”. Quando a chance do app vezes a melhor odd encontrada passa de 1,05, o jogo ganha a estrela ★ de valor. As odds ficam congeladas no apito inicial, e a aba Acertos → App x Mercado mostra, com honestidade, quem prevê melhor e como teriam ido os sinais.": ["Cuotas y valor: la app busca las cuotas de varias casas cada 3 horas, quita el margen de cada una y usa la mediana como “probabilidad del mercado”. Cuando la probabilidad de la app por la mejor cuota encontrada supera 1,05, el partido gana la estrella ★ de valor. Las cuotas se congelan en el pitido inicial, y la pestaña Aciertos → App vs. Mercado muestra con honestidad quién pronostica mejor y cómo habrían ido las señales.", "Odds and value: the app fetches odds from several bookmakers every 3 hours, removes each one's margin and uses the median as the “market chance”. When the app's chance times the best odds found exceeds 1.05, the match gets the ★ value star. Odds are frozen at kick-off, and the Track record → App vs. Market tab honestly shows who predicts better and how the signals would have done."], "Ordenar por": ["Ordenar por", "Sort by"], "Os jogos de amanhã aparecem na próxima atualização automática (de hora em hora). Toque em Atualizar para buscar agora.": ["Los partidos de mañana aparecen en la próxima actualización automática (cada hora). Toca Actualizar para buscar ahora.", "Tomorrow's matches appear on the next automatic update (every hour). Tap Refresh to fetch now."], "Panorama final: ": ["Resumen final: ", "Final summary: "], "Placar": ["Marcador", "Score"], "Placar entre os 3 mais prováveis": ["Marcador entre los 3 más probables", "Score among the 3 most likely"], "Placar exato": ["Marcador exacto", "Correct score"], "Placar final ": ["Marcador final ", "Final score "], "Placar mais provável dentro do resultado favorito. Os 3 placares individuais mais prováveis estão em “Ver todos os números”.": ["Marcador más probable dentro del resultado favorito. Los 3 marcadores individuales más probables están en “Ver todos los números”.", "Most likely score within the favored outcome. The 3 individually most likely scores are under “See all numbers”."], "Placar sugerido ": ["Marcador sugerido ", "Suggested score "], "Placar sugerido certo": ["Marcador sugerido acertado", "Suggested score correct"], "Placares mais prováveis": ["Marcadores más probables", "Most likely scores"], "Plano da API": ["Plan de la API", "API plan"], "Pontos": ["Puntos", "Points"], "Por competição": ["Por competición", "By competition"], "Previsão base": ["Pronóstico base", "Base prediction"], "Previsão com desfalques (experimental)": ["Pronóstico con bajas (experimental)", "Prediction with absences (experimental)"], "Previsões": ["Pronósticos", "Predictions"], "Previsões calculadas": ["Pronósticos calculados", "Predictions computed"], "Previsões comparadas com os placares reais": ["Pronósticos comparados con los re function pct(x){ return x==null ? "–" : (Math.round(x*1000)/10).toFixed(1).replace(".",DSEP)+"%"; }

var WD=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"], MON=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function dObj(s){ var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(s,n){ var d=dObj(s); d.setDate(d.getDate()+n); return ymd(d); }
function dLong(s){ var d=dObj(s);
  if (LANG!=="pt") try{ var t=new Intl.DateTimeFormat(LOCALE,{weekday:"long",day:"numeric",month:"short",year:"numeric"}).format(d); return t.charAt(0).toUpperCase()+t.slice(1); }catch(e){}
  return WD[d.getDay()]+", "+d.getDate()+T(" de ")+MON[d.getMonth()]+T(" de ")+d.getFullYear(); }
function dShort(s){ var d=dObj(s);
  if (LANG!=="pt") try{ var t=new Intl.DateTimeFormat(LOCALE,{weekday:"short",day:"numeric",month:"numeric"}).format(d); return t.charAt(0).toUpperCase()+t.slice(1); }catch(e){}
  return WD[d.getDay()].slice(0,3)+" "+d.getDate()+"/"+(d.getMonth()+1); }
function kickoff(m){
  if (m.ko) try{ return new Date(m.ko).toLocaleTimeString(LOCALE,{hour:"2-digit",minute:"2-digit"}); }catch(e){}
  return m.t||""; }
function todayBR(){ try{ return new Intl.DateTimeFormat("en-CA",{timeZone:"America/Sao_Paulo",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date()); }catch(e){ return ymd(new Date()); } }

var MARKETS = [
  {id:"p1",   name:T("1 gol ou mais"),      short:T("1+ gol")},
  {id:"p2",   name:T("2 gols ou mais"),     short:T("2+ gols")},
  {id:"p3",   name:T("3 gols ou mais"),     short:T("3+ gols")},

  {id:"score",name:T("Placar exato"),       short:"placar exato"}
];
function mkt(id){ return MARKETS.find(function(m){return m.id===id;}) || MARKETS[0]; }
function prob(m,id){

function repoInfo(){
  var o=store.get("owner",""), r=store.get("repo","");
  if (!o && /\.github\.io$/.test(location.hostname)){
    o=location.hostname.split(".")[0];
    r=location.pathname.split("/").filter(Boolean)[0] || (o+".github.io");
  }
  return {owner:o, repo:r};
}
function gh(path,opt){
  var tk=store.get("token","");
  opt=opt||{}; opt.headers=Object.assign({"Accept":"application/vnd.github+json","Authorization":"Bearer "+tk,"X-GitHub-Api-Version":"2022-11-28"},opt.headers||{});
  var R=repoInfo();
  return fetch("https://api.github.com/repos/"+R.owner+"/"+R.repo+path,opt);
}
function canDispatch(){ var R=repoInfo(); return !S.demo && store.get("token","") && R.owner && R.repo; }
var busy=false;
function setBusy(on,label){
  busy=on; var b=$("refresh"); b.disabled=on; b.classList.toggle("spin",on);
  b.querySelector(".lbl").textContent = on ? (label||T("Atualizando…")) : T("Atualizar");
}
function refresh(){
  if (busy) return;
  if (!canDispatch()){
    setBusy(true,T("Recarregando…"));
    loadData().then(function(){ setStatus(); route(); setBusy(false);
      toast(S.demo ? T("Prévia: na versão instalada este botão busca dados novos.") : T("Dados recarregados. O app se atualiza sozinho de hora em hora; para buscar na hora, ative a atualização com um toque em Ajustes."));
    }).catch(function(){ setBusy(false); toast(T("Sem conexão. Tente de novo em instantes.")); });
    return;
  }
  setBusy(true,T("Buscando jogos…"));
  var started=Date.now();
  gh("").then(function(r){ if(!r.ok) throw r; return r.json(); })
  .then(function(repo){
    return gh("/actions/workflows/atualizar.yml/dispatches",{method:"POST",body:JSON.stringify({ref:repo.default_branch||"main"})});
  }).then(function(r){
    if (r.status!==204) throw r;
    toast(T("Busca iniciada. Leva de 2 a 4 minutos; pode continuar usando o app."));
    poll(started,0);
  }).catch(function(e){
    setBusy(false);
    var st=e&&e.status;
    toast(st===401 ? T("A chave de acesso não foi aceita. Confira em Ajustes.") : st===404||st===403 ? T("Sem permissão para iniciar a atualização. Confira a chave e o repositório em Ajustes.") : T("Não consegui iniciar a busca agora. Tente de novo em instantes."));
  });
}
function poll(started,n){
  if (n>40){ setBusy(false); toast(T("A busca está demorando. Ela continua no GitHub; toque em Atualizar daqui a pouco.")); return; }
  setTimeout(function(){
    gh("/actions/workflows/atualizar.yml/runs?per_page=1").then(function(r){ return r.json(); }).then(function(j){
      var run=j.workflow_runs&&j.workflow_runs[0];
      if (!run || new Date(run.created_at).getTime() < started-60000){ return poll(started,n+1); }
      if (run.status!=="completed"){ setBusy(true, run.status==="queued" ? T("Na fila…") : T("Calculando…")); return poll(started,n+1); }
      if (run.conclusion!=="success"){ setBusy(false); toast(T("A busca terminou com erro. Veja os detalhes em Ajustes > Ver execuções no GitHub.")); return; }
      setBusy(true,T("Publicando…"));
      setTimeout(function(){ loadData().then(function(){ S.months={}; setStatus(); route(); setBusy(false); toast(T("Pronto! Jogos e placares atualizados.")); }); },25000);
    }).catch(function(){ poll(started,n+1); });
  }, n===0 ? 20000 : 12000);
}
$("refresh").addEventListener("click",refresh);
