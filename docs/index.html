<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FootPrevia</title>
<meta name="description" content="Previsões de placar e de gols para as principais ligas do mundo, com histórico de acertos.">
<meta name="theme-color" content="#1d5c3f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="footprevia-192.png">
<link rel="apple-touch-icon" href="footprevia-apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FootPrevia">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6f1; --surface:#ffffff; --ink:#13261d; --muted:#56695e; --line:#d6dfd7;
  --pitch:#1d5c3f; --pitch-soft:#e3eee6; --accent:#d9a800; --miss:#b9c4bc; --bad:#b3412e; --good:#1d7a4c;
  --draw:#8a9a90; --away:#3f6fa0;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1f17; --surface:#122a20; --ink:#e7efe9; --muted:#97ac9f; --line:#24412f;
    --pitch:#46a173; --pitch-soft:#173628; --accent:#f2c94c; --miss:#3a5446; --bad:#e2735e; --good:#5cc28c;
    --draw:#7d9187; --away:#6d9bd0; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;margin:0;line-height:1.05}
button,select,input{font:inherit;color:inherit}
a{color:var(--pitch)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:920px;margin:0 auto;padding:0 1rem calc(6.5rem + env(safe-area-inset-bottom,0px))}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.top .in{max-width:920px;margin:0 auto;padding:.6rem 1rem;display:flex;align-items:center;gap:.8rem}
.logo{width:40px;height:40px;flex:none}
.brand{flex:1;min-width:0}
.brand b{font-family:"Barlow Condensed",sans-serif;font-size:1.5rem;font-weight:800;letter-spacing:-.01em;display:block;line-height:1}
.brand small{color:var(--muted);font-size:.82rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:0;border-radius:10px;padding:.6rem 1rem;font-weight:600;cursor:pointer;background:var(--pitch);color:#fff;display:inline-flex;align-items:center;gap:.45rem;text-decoration:none}
.btn.ghost{background:transparent;color:var(--pitch);border:1.5px solid var(--pitch)}
.btn:disabled{opacity:.6;cursor:wait}
.btn svg{width:18px;height:18px;flex:none}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.banner{max-width:920px;margin:.8rem auto 0;padding:.7rem 1rem;border-radius:10px;background:var(--pitch-soft);font-size:.92rem}
.banner[hidden]{display:none}

/* navegação inferior */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom .in{max-width:920px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bottom a{display:flex;flex-direction:column;align-items:center;gap:.1rem;padding:.5rem .2rem .55rem;text-decoration:none;color:var(--muted);font-size:.78rem;font-weight:600}
nav.bottom a svg{width:22px;height:22px}
nav.bottom a[aria-current="page"]{color:var(--pitch)}

/* cabeçalho de página */
.hero{padding:1.4rem 0 1rem}
.hero .date{color:var(--muted);font-weight:500;margin:0 0 .2rem}
.hero h1{font-size:clamp(2.1rem,7vw,3.4rem);font-weight:800;letter-spacing:-.01em}
.tally{display:flex;align-items:baseline;gap:.6rem;margin-top:.7rem;flex-wrap:wrap}
.tally b{font-family:"Barlow Condensed",sans-serif;font-size:clamp(2.6rem,9vw,4rem);line-height:.9;font-weight:800;color:var(--pitch)}
.tally span{color:var(--muted);max-width:34ch}
.tstat{color:var(--muted);margin:.45rem 0 0;max-width:60ch}
.tstat b{color:var(--ink);font-weight:600}
.tstat.mk{color:var(--ink)}

/* filtros */
.filters{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));padding:.9rem 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.filters label{display:block;font-weight:600;font-size:.88rem;margin-bottom:.3rem}
select,input[type=search],input[type=text],input[type=password]{width:100%;padding:.55rem .6rem;border:1.5px solid var(--line);border-radius:8px;background:var(--surface)}

/* jogos */
.group{margin-top:1.4rem}
.group h2{font-size:1.4rem;font-weight:700}
.group .src{color:var(--muted);font-size:.85rem;margin:.15rem 0 .4rem}
.match{border-top:1px solid var(--line);padding:.85rem 0}
.match:last-child{border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:3.3rem 1fr auto;gap:.7rem;align-items:center}
.time{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:1.1rem;color:var(--muted)}
.teams{font-weight:600;font-size:1.03rem;line-height:1.25;min-width:0}
.teams .sub{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.3rem;font-weight:500;font-size:.82rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:.25rem;border-radius:6px;padding:.05rem .45rem;background:var(--pitch-soft);color:var(--ink);font-weight:600}
.chip.res{background:transparent;border:1.5px solid currentColor;font-family:"Barlow Condensed",sans-serif;font-size:.95rem}
.chip.hit{color:var(--good)} .chip.miss{color:var(--bad)}
.pct{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:2rem;line-height:1;text-align:right;min-width:4.4ch}
.pct small{display:block;font-size:.72rem;font-weight:600;color:var(--muted);font-family:"Barlow",sans-serif}
.crest{width:1.2em;height:1.2em;object-fit:contain;vertical-align:-.22em;margin-right:.3em;flex:none}
.favlist .crest{margin-right:0}
.chip.live{background:#c62828;color:#fff}
.chip.live.end{background:var(--ink);color:var(--surface)}
.teams .fav::before{content:"♥ ";color:#c62828}
.follow{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0 .2rem}
.follow button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:.3rem .8rem;font-weight:600;cursor:pointer;font:inherit;font-size:.85rem}
.follow button[aria-pressed="true"]{border-color:#c62828;color:#c62828}
.favlist{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0}
.favlist span{display:inline-flex;align-items:center;gap:.3rem;border:1.5px solid var(--line);border-radius:999px;padding:.2rem .3rem .2rem .7rem;font-weight:600}
.favlist button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1rem;line-height:1;padding:.1rem .35rem}
.lgtag{display:block;font-size:.78rem;font-weight:500;color:var(--muted);margin-bottom:.1rem}
.hda{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:.55rem 0 0 4rem;background:var(--pitch-soft)}
.hda i{display:block;height:100%}
.hda i:nth-child(1){background:var(--pitch)} .hda i:nth-child(2){background:var(--draw)} .hda i:nth-child(3){background:var(--away)}
.hdal{display:flex;justify-content:space-between;margin:.2rem 0 0 4rem;font-size:.78rem;color:var(--muted)}
details{margin:.45rem 0 0 4rem}
summary{cursor:pointer;color:var(--pitch);font-weight:600;font-size:.88rem;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"+ "} details[open] summary::before{content:"− "}
.det{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.25rem 1.2rem;font-size:.88rem;padding:.5rem 0 .2rem;color:var(--muted)}
.det b{color:var(--ink);font-weight:600}
.form{display:inline-flex;gap:3px;vertical-align:middle}
.form i{font-style:normal;font-weight:700;font-size:.72rem;width:1.35em;height:1.35em;display:inline-grid;place-items:center;border-radius:4px;color:#fff}
.form i.V{background:var(--good)} .form i.E{background:var(--draw)} .form i.D{background:var(--bad)}
.chip.tb{background:#ffe1c7;color:#7a2e00;font-weight:700}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .chip.tb{background:#5a2a0c;color:#ffd2ad} }
.tbbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:1rem;padding:.6rem .8rem;border-radius:10px;background:#ffe1c7;color:#7a2e00;font-weight:600}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tbbar{background:#5a2a0c;color:#ffd2ad} }
.tbbar button{border:0;border-radius:8px;padding:.3rem .7rem;font-weight:700;background:#7a2e00;color:#fff;cursor:pointer}
.chip.val{background:#f2c94c;color:#13261d}
.pan{display:flex;flex-wrap:wrap;gap:.2rem .7rem;margin:.4rem 0 0 4rem;font-size:.8rem}
.pan span{white-space:nowrap;color:var(--muted)} .pan span.y b{color:var(--good)} .pan span.n b{color:var(--bad)}
.list a .pan{margin:.3rem 0 0}
.filt{font-size:.85rem;color:var(--ink);font-weight:600;margin-top:.2rem}
.injrow{margin:.35rem 0 0 4rem;font-size:.8rem;color:var(--muted);line-height:1.45}
.injrow b{color:var(--ink);font-weight:600}
.injlist{margin:.4rem 0 0;padding:0;list-style:none;font-size:.85rem}
.injlist li{padding:.15rem 0;color:var(--muted)}
.injlist li b{color:var(--ink);font-weight:600}
.tag{font-size:.72rem;font-weight:700;border-radius:4px;padding:0 .3rem;margin-left:.3rem;background:var(--pitch-soft);color:var(--ink)}
.mkline{margin:.15rem 0 0 4rem;font-size:.78rem;color:var(--muted)}
.otbl{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem;min-width:0}
.otbl th,.otbl td{padding:.3rem .35rem;border-bottom:1px solid var(--line);text-align:right}
.otbl th:first-child,.otbl td:first-child{text-align:left}
.otbl td.vp{color:var(--good);font-weight:700}
.note{font-size:.8rem;color:var(--muted);margin:.4rem 0 0}
.chip.up{background:#e5f4e4;color:#14532d} .chip.down{background:#fbebeb;color:#7f1d1d}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .chip.up{background:#173f2a;color:#a7e3bf} :root:not([data-theme="light"]) .chip.down{background:#4a1f1a;color:#f3b3a6} }
.tlist{margin-top:.6rem}
.trow{border-top:1px solid var(--line);padding:.75rem 0}
.trow:last-child{border-bottom:1px solid var(--line)}
.trow .top{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem}
.trow .top b{font-weight:600;font-size:1.02rem}
.trow .top span{color:var(--muted);font-size:.82rem;white-space:nowrap}
.tm{display:grid;grid-template-columns:5.2rem 1fr auto;gap:.15rem .6rem;font-size:.88rem;margin-top:.35rem;align-items:baseline}
.tm .k{color:var(--muted)} .tm .d{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.05rem;text-align:right}
.tm .d.pos{color:var(--good)} .tm .d.neg{color:var(--bad)}
.conf{font-size:.74rem;font-weight:600;border-radius:4px;padding:0 .35rem;margin-left:.35rem;white-space:nowrap}
.conf.c2{background:var(--pitch);color:#fff} .conf.c1{background:var(--pitch-soft);color:var(--ink)}
.formrow{display:flex;flex-wrap:wrap;gap:.3rem 1rem;margin:.5rem 0 0 4rem;font-size:.82rem;color:var(--muted);align-items:center}
.empty{padding:1.2rem 0;color:var(--muted)}

/* histórico e desempenho */
.list a{display:grid;grid-template-columns:1fr auto;gap:.5rem;align-items:center;padding:.8rem 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.list a b{font-weight:600}
.list a span{color:var(--muted);font-size:.88rem}
.list a .rate{font-family:"Barlow Condensed",sans-serif;font-size:1.6rem;font-weight:800;text-align:right}
.list a .rate small{display:block;font-family:"Barlow",sans-serif;font-size:.72rem;font-weight:600;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:.35rem .85rem;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pitch);color:#fff;border-color:var(--pitch)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-top:1rem}
.kpi{border-top:3px solid var(--pitch);padding-top:.55rem}
.kpi h3{font-size:1.2rem;font-weight:700}
.kpi .big{font-family:"Barlow Condensed",sans-serif;font-size:2.8rem;font-weight:800;line-height:1}
.kpi p{margin:.2rem 0;color:var(--muted);font-size:.9rem}
.sect{margin-top:1.8rem}
.sect h2{font-size:1.45rem}
.sect>p{color:var(--muted);margin:.3rem 0 0;max-width:70ch;font-size:.94rem}
.tblwrap{overflow-x:auto;margin-top:.6rem}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:460px}
th,td{text-align:right;padding:.45rem .5rem;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted)}

/* ajustes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.1rem;margin-top:1rem}
.card h2{font-size:1.4rem;margin-bottom:.3rem}
.card p{margin:.4rem 0;color:var(--muted);font-size:.94rem;max-width:68ch}
.card ol{margin:.6rem 0;padding-left:1.3rem;font-size:.95rem}
.card ol li{margin:.35rem 0}
.card .actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.8rem}
.ok{color:var(--good);font-weight:600} .err{color:var(--bad);font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.3rem 1rem;font-size:.92rem}
.kv span{color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(5.2rem + env(safe-area-inset-bottom,0px));z-index:8;background:var(--ink);color:var(--bg);padding:.65rem 1rem;border-radius:10px;font-size:.92rem;max-width:min(92vw,520px);box-shadow:0 4px 18px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
[hidden]{display:none!important}
@media (max-width:520px){
  .row{grid-template-columns:2.9rem 1fr auto;gap:.55rem}
  .hda,.hdal,details,.formrow,.mkline,.injrow,.match .pan{margin-left:3.45rem}
  .pct{font-size:1.75rem}
  .btn .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){ .spin svg{animation:none} }
/* abertura */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;
  padding:env(safe-area-inset-top,0px) 1.5rem env(safe-area-inset-bottom,0px);
  background:radial-gradient(120% 90% at 30% 20%,#11744D 0%,#0A4A33 45%,#04261B 100%);color:#fff;cursor:pointer;
  animation:spSafety .3s ease 5s forwards}
#splash .sp-mark{width:min(62vw,300px);height:auto;overflow:visible}
#splash .sp-name{font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:800;font-size:clamp(2.9rem,13vw,4.6rem);line-height:.95;letter-spacing:-.01em;margin:.6rem 0 0;opacity:0}
#splash .sp-tag{font-family:"Barlow",system-ui,sans-serif;font-weight:500;font-size:clamp(1rem,4vw,1.15rem);color:rgba(255,255,255,.78);margin:0;opacity:0;text-align:center}
#splash .sp-hint{position:absolute;bottom:calc(1.4rem + env(safe-area-inset-bottom,0px));font-size:.8rem;color:rgba(255,255,255,.55);margin:0}
#splash.out{opacity:0;transition:opacity .32s ease;pointer-events:none}
@keyframes spSafety{to{opacity:0;visibility:hidden;pointer-events:none}}
</style>
</head>
<body>
<div id="splash" role="img" aria-label="FootPrevia">
  <svg class="sp-mark" viewBox="0 0 1024 1024" aria-hidden="true"><defs><linearGradient id="sp-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11744D"/><stop offset="1" stop-color="#04261B"/></linearGradient>
<linearGradient id="sp-gd" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#FF7A1A"/><stop offset=".5" stop-color="#FFC23A"/><stop offset="1" stop-color="#FFE68C"/></linearGradient>
<pattern id="sp-net" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0H30M0 0V30" stroke="#FFD25A" stroke-opacity=".6" stroke-width="5"/></pattern></defs><g id="sp-slash"><path d="M720 196 L806 238 L322 836 L262 806 Z" fill="url(#sp-gd)"/></g><g id="sp-ring"><circle cx="690" cy="690" r="112" fill="url(#sp-net)"/><circle cx="690" cy="690" r="112" fill="none" stroke="url(#sp-gd)" stroke-width="52"/></g><g id="sp-ball"><circle cx="340" cy="340" r="170" fill="#fff"/><clipPath id="sp-bc"><circle cx="340" cy="340" r="170"/></clipPath><g clip-path="url(#sp-bc)" fill="#0A2E22" stroke="#0A2E22" stroke-width="8.5" stroke-linejoin="round"><polygon points="340.0,282.2 395.0,322.1 374.0,386.8 306.0,386.8 285.0,322.1"/><polygon points="340.0,231.2 281.8,188.9 304.0,120.5 376.0,120.5 398.2,188.9"/><line x1="340.0" y1="282.2" x2="340.0" y2="231.2" stroke-linecap="round"/><polygon points="443.5,306.4 465.7,238.0 537.7,238.0 559.9,306.4 501.7,348.7"/><line x1="395.0" y1="322.1" x2="443.5" y2="306.4" stroke-linecap="round"/><polygon points="404.0,428.0 475.9,428.0 498.1,496.4 439.9,538.7 381.7,496.4"/><line x1="374.0" y1="386.8" x2="404.0" y2="428.0" stroke-linecap="round"/><polygon points="276.0,428.0 298.3,496.4 240.1,538.7 181.9,496.4 204.1,428.0"/><line x1="306.0" y1="386.8" x2="276.0" y2="428.0" stroke-linecap="round"/><polygon points="236.5,306.4 178.3,348.7 120.1,306.4 142.3,238.0 214.3,238.0"/><line x1="285.0" y1="322.1" x2="236.5" y2="306.4" stroke-linecap="round"/></g></g></svg>
  <p class="sp-name">FootPrevia</p>
  <p class="sp-tag" id="sp-tag">Chance de gol em cada jogo do dia</p>
  <p class="sp-hint" id="sp-hint">Toque para entrar</p>
</div>
<script>
/* Abertura: a bola entra na rede (com som) e volta para formar o %. Uma vez por abertura do app. */
(function(){
  var sp=document.getElementById("splash"); if(!sp) return;
  var seen=false; try{ seen=sessionStorage.getItem("gp_splash")==="1"; sessionStorage.setItem("gp_splash","1"); }catch(e){}
  if (seen){ sp.parentNode.removeChild(sp); return; }
  var lang=(navigator.language||"pt").slice(0,2).toLowerCase(), saved=null;
  try{ saved=JSON.parse(localStorage.getItem("gp_lang")); }catch(e){}
  if (saved && saved!=="auto") lang=saved; lang=lang==="pt"||lang==="es"?lang:"en";
  var TX={pt:["Chance de gol em cada jogo do dia","Toque para entrar"],es:["Probabilidad de gol en cada partido del día","Toca para entrar"],en:["Goal chances for every match of the day","Tap to enter"]}[lang];
  document.getElementById("sp-tag").textContent=TX[0]; document.getElementById("sp-hint").textContent=TX[1];
  var sound=true; try{ var v=localStorage.getItem("gp_sound"); if(v!=null) sound=JSON.parse(v); }catch(e){}
  var reduce=window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var ctx=null, heard=false, closed=false;
  function audio(){ if(!sound) return null; if(!ctx){ try{ var AC=window.AudioContext||window.webkitAudioContext; if(AC) ctx=new AC(); }catch(e){} } return ctx; }
  function netSound(fromTap){
    var c=audio(); if(!c) return;
    try{
      if (c.state==="running") return play(c);
      var r=c.resume(); if (fromTap && r && r.then) r.then(function(){ if (c.state==="running") play(c); });
    }catch(e){}
  }
  function play(c){
    try{
      heard=true;
      var t=c.currentTime+0.01, out=c.createGain(); out.gain.value=0.8; out.connect(c.destination);
      var o=c.createOscillator(), g=c.createGain(); o.type="sine";
      o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(45,t+0.15);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.9,t+0.005); g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);

de hoje). Esse ajuste foi escolhido testando 22 temporadas reais de 8 ligas: melhorou todas as previsões, principalmente no começo das temporadas. Os quadradinhos V, E e D mostram os 5 últimos resultados de cada time.": ["Forma reciente: además de la temporada actual, la app usa la anterior, y cada partido pesa menos a medida que envejece (un partido de hace un año vale la mitad que uno de hoy). Este ajuste se eligió probando 22 temporadas reales de 8 ligas: mejoró todos los pronósticos, sobre todo al inicio de las temporadas. Los cuadraditos G, E y P muestran los 5 últimos resultados de cada equipo.", "Recent form: besides the current season, the app uses the previous one, and each match counts less as it ages (a match from a year ago is worth half of one today). This was chosen by testing 22 real seasons from 8 leagues: it improved every prediction, especially early in the season. The W, D and L squares show each team's last 5 results."], "Ganham mais pontos que o previsto": ["Ganan más puntos de lo previsto", "Earn more points than predicted"], "Ganham menos pontos que o previsto": ["Ganan menos puntos de lo previsto", "Earn fewer points than predicted"], "Gols esperados": ["Goles esperados", "Expected goals"], "Gols feitos": ["Goles a favor", "Goals scored"], "Gols por jogo": ["Goles por partido", "Goals per match"], "Gols sofridos": ["Goles en contra", "Goals conceded"], "Histórico": ["Historial", "History"], "Hoje": ["Hoy", "Today"], "Idioma": ["Idioma", "Language"], "Idioma do app": ["Idioma de la app", "App language"], "Informações": ["Información", "Information"], "Instalar no celular ou computador": ["Instalar en el móvil o el ordenador", "Install on phone or computer"], "Instalar o app": ["Instalar la app", "Install the app"], "Instalação, atualização e informações": ["Instalación, actualización e información", "Install, update and info"], "Instale para abrir o FootPrevia direto da tela inicial, como qualquer app.": ["Instálala para abrir FootPrevia desde la pantalla de inicio, como cualquier app.", "Install it to open FootPrevia from your home screen, like any app."], "Jogos": ["Partidos", "Matches"], "Jogos com desfalques": ["Partidos con bajas", "Matches with absences"], "Jogos com odds": ["Partidos con cuotas", "Matches with odds"], "Jogos de amanhã": ["Partidos de mañana", "Tomorrow's matches"], "Jogos de hoje": ["Partidos de hoy", "Today's matches"], "Jogos encontrados amanhã": ["Partidos encontrados mañana", "Matches found tomorrow"], "Jogos encontrados hoje": ["Partidos encontrados hoy", "Matches found today"], "Jogue com responsabilidade. Apostas envolvem risco de perda. Proibido para menores de 18 anos.": ["Juega con responsabilidad. Las apuestas implican riesgo de pérdida. Prohibido para menores de 18 años.", "Gamble responsibly. Betting involves risk of loss. Not for anyone under 18."], "Ler a política de privacidade": ["Leer la política de privacidad", "Read the privacy policy"], "Ligas sem odds (falha)": ["Ligas sin cuotas (fallo)", "Leagues without odds (error)"], "Mais previsíveis": ["Más previsibles", "Most predictable"], "Marcam mais que o previsto": ["Marcan más de lo previsto", "Score more than predicted"], "Marcam menos que o previsto": ["Marcan menos de lo previsto", "Score less than predicted"], "Melhor": ["Mejor", "Better"], "Melhor odd": ["Mejor cuota", "Best odds"], "Mercado": ["Mercado", "Market"], "Mercado: casa ": ["Mercado: local ", "Market: home "], "Mostrar": ["Mostrar", "Show"], "Motivo: ": ["Motivo: ", "Reason: "], "Na fila…": ["En cola…", "Queued…"], "Na simulação da temporada, a diferença é consistente (não parece acaso).": ["En la simulación de la temporada, la diferencia es consistente (no parece azar).", "In the season simulation, the difference is consistent (not likely chance)."], "Nenhum jogo com valor (★) neste mercado. Troque o mercado ou veja mais tarde: as odds são atualizadas a cada 3 horas.": ["Ningún partido con valor (★) en este mercado. Cambia de mercado o mira más tos muestra si acierta más que el pronóstico base.", "The app computes, in parallel, a prediction that accounts for missing players: half of the absent attackers' share of goals is lost, and a missing starting goalkeeper or defenders increase the opponent's goals. It is still being tested: the Track record tab shows whether it beats the base prediction."], "O app comparado com as odds das casas": ["La app comparada con las cuotas de las casas", "The app compared with bookmaker odds"], "O app já está instalado neste aparelho.": ["La app ya está instalada en este dispositivo.", "The app is already installed on this device."], "O app já se atualiza sozinho de hora em hora, das 8h à 1h. Se quiser que o botão Atualizar busque jogos e placares na hora, faça isto uma única vez neste aparelho:": ["La app ya se actualiza sola cada hora. Si quieres que el botón Actualizar busque partidos y resultados al momento, haz esto una sola vez en este dispositivo:", "The app already updates itself every hour. If you want the Refresh button to fetch matches and results right away, do this once on this device:"], "O app não pede cadastro, não usa rastreadores nem anúncios.": ["La app no pide registro ni usa rastreadores o anuncios.", "The app needs no sign-up and uses no trackers or ads."], "O que você quer prever": ["Qué quieres pronosticar", "What do you want to predict"], "Odd ": ["Cuota ", "Odds "], "Odds de ": ["Cuotas de ", "Odds from "], "Odds e valor: o app busca as odds de várias casas a cada 3 horas, remove a margem de cada uma e usa a mediana como “chance do mercado”. Quando a chance do app vezes a melhor odd encontrada passa de 1,05, o jogo ganha a estrela ★ de valor. As odds ficam congeladas no apito inicial, e a aba Acertos → App x Mercado mostra, com honestidade, quem prevê melhor e como teriam ido os sinais.": ["Cuotas y valor: la app busca las cuotas de varias casas cada 3 horas, quita el margen de cada una y usa la mediana como “probabilidad del mercado”. Cuando la probabilidad de la app por la mejor cuota encontrada supera 1,05, el partido gana la estrella ★ de valor. Las cuotas se congelan en el pitido inicial, y la pestaña Aciertos → App vs. Mercado muestra con honestidad quién pronostica mejor y cómo habrían ido las señales.", "Odds and value: the app fetches odds from several bookmakers every 3 hours, removes each one's margin and uses the median as the “market chance”. When the app's chance times the best odds found exceeds 1.05, the match gets the ★ value star. Odds are frozen at kick-off, and the Track record → App vs. Market tab honestly shows who predicts better and how the signals would have done."], "Ordenar por": ["Ordenar por", "Sort by"], "Os jogos de amanhã aparecem na próxima atualização automática (de hora em hora). Toque em Atualizar para buscar agora.": ["Los partidos de mañana aparecen en la próxima actualización automática (cada hora). Toca Actualizar para buscar ahora.", "Tomorrow's matches appear on the next automatic update (every hour). Tap Refresh to fetch now."], "Panorama final: ": ["Resumen final: ", "Final summary: "], "Placar": ["Marcador", "Score"], "Placar entre os 3 mais prováveis": ["Marcador entre los 3 más probables", "Score among the 3 most likely"], "Placar exato": ["Marcador exacto", "Correct score"], "Placar final ": ["Marcador final ", "Final score "], "Placar mais provável dentro do resultado favorito. Os 3 placares individuais mais prováveis estão em “Ver todos os números”.": ["Marcador más probable dentro del resultado favorito. Los 3 marcadores individuales más probables están en “Ver todos los números”.", "Most likely score within the favored outcome. The 3 individually most likely scores are under “See all numbers”."], "Placar sugerido ": ["Marcador sugerido ", "Suggested score "], "Placar sugerido certo": ["Marcador sugerido acertado", "Suggested score correct"], "Placares mais prováveis": ["Marcadores más probables", "Most likely scores"], "Plano da API": ["Plan de la API", "API plan"], "Pontos": ["Puntos", "Points"], "Por competição": ["Por competición", "By competition"], "Previsão base": ["Pronóstico base", "Base prediction"], "Previsão com desfalques (experimental)": ["Pronóstico con bajas (experimental)", "Prediction with absences (experimental)"], "Previsões": ["Pronósticos", "Predictions"], "Previsões calculadas": ["Pronósticos calculados", "Predictions computed"], "Previsões comparadas com os placares reais": ["Pronósticos comparados con los resultados reales", "Predictions compared with real results"], "Privacidade": ["Privacidad", "Privacy"], "Procurar time": ["Buscar equipo", "Search team"], "Pronto! Jogos e placares atualizados.": ["¡Listo! Partidos y resultados actualizados.", "Done! Matches and results updated."], "Prévia: na versão instalada este botão busca dados novos.": ["Vista previa: en la versión instalada este botón busca datos nuevos.", "Preview: in the installed version this button fetches new data."], "Publicando…": ["Publicando…", "Publishing…"], "Quantas vezes “": ["Cuántas veces “", "How often “"], "Quem prevê melhor?": ["¿Quién pronostica mejor?", "Who predicts better?"], "Quem rende acima ou abaixo do que o modelo prevê": ["Quién rinde por encima o por debajo de lo que prevé el modelo", "Who performs above or below what the model predicts"], "Recarregando…": ["Recargando…", "Reloading…"], "Repositório (só mexa se o teste falhar)": ["Repositorio (cámbialo solo si la prueba falla)", "Repository (only change it if the test fails)"], "Repositório salvo.": ["Repositorio guardado.", "Repository saved."], "Requisições restantes hoje": ["Solicitudes restantes hoy", "Requests left today"], "Requisições usadas hoje": ["Solicitudes usadas hoy", "Requests used today"], "Resultado": ["Resultado", "Result"], "Resultado (casa/empate/fora)": ["Resultado (local/empate/visitante)", "Result (home/draw/away)"], "Retorno": ["Retorno", "Return"], "Retorno simulado": ["Retorno simulado", "Simulated return"], "Role e toque em “Adiciona  pouco menos que o modelo atual. A aba Acertos mostra se isso se confirma nos jogos reais. Se as duas chaves estiverem ligadas, vale a combinada.": ["La app calcula, en paralelo, un segundo pronóstico: el promedio del modelo actual con el Dixon-Coles completo, que mide la fuerza de cada equipo teniendo en cuenta contra quién jugó. En la prueba con 22 temporadas, el promedio se equivocó un poco menos que el modelo actual. La pestaña Aciertos muestra si se confirma en los partidos reales. Si los dos interruptores están activados, vale el combinado.", "The app computes a second forecast in parallel: the average of the current model and the full Dixon-Coles model, which measures each team's strength taking into account who it played against. In the 22-season test, the average erred slightly less than the current model. The Accuracy tab shows whether this holds up in real matches. If both switches are on, the combined forecast wins."], "Agora os jogos mostram a previsão combinada, quando houver.": ["Ahora los partidos muestran el pronóstico combinado, cuando lo haya.", "Matches now show the combined forecast, when available."], "Usar a previsão combinada nas telas de jogos": ["Usar el pronóstico combinado en las pantallas de partidos", "Use the combined forecast on the match screens"], "Contato": ["Contacto", "Contact"], "Abertura": ["Pantalla de inicio", "Opening screen"], "Som de bola na rede ao abrir o app": ["Sonido de balón en la red al abrir la app", "Ball-in-the-net sound when opening the app"], "Alguns celulares, como o iPhone, só liberam o som depois de um toque: toque na tela de abertura para ouvir.": ["Algunos celulares, como el iPhone, solo permiten el sonido después de un toque: toca la pantalla de inicio para oírlo.", "Some phones, like the iPhone, only allow sound after a tap: tap the opening screen to hear it."], "Ver a abertura de novo": ["Ver la pantalla de inicio otra vez", "Watch the opening again"], "Só meus times (♥)": ["Solo mis equipos (♥)", "Only /* ================= GitHub: atualizar na hora ================= */
function repoInfo(){
  var o=store.get("owner",""), r=store.get("repo","");
  if (!o && /\.github\.io$/.test(location.hostname)){
    o=location.hostname.split(".")[0];
    r=location.pathname.split("/").filter(Boolean)[0] || (o+".github.io");
  }
  return {owner:o, repo:r};
}
function gh(path,opt){
  var tk=store.get("token","");
  opt=opt||{}; opt.headers=Object.assign({"Accept":"application/vnd.github+json","Authorization":"Bearer "+tk,"X-GitHub-Api-Version":"2022-11-28"},opt.headers||{});
  var R=repoInfo();
  return fetch("https://api.github.com/repos/"+R.owner+"/"+R.repo+path,opt);
}
function canDispatch(){ var R=repoInfo(); return !S.demo && store.get("token","") && R.owner && R.repo; }
var busy=false;
function setBusy(on,label){
  busy=on; var b=$("refresh"); b.disabled=on; b.classList.toggle("spin",on);
  b.querySelector(".lbl").textContent = on ? (label||T("Atualizando…")) : T("Atualizar");
}
function refresh(){
  if (busy) return;
  if (!canDispatch()){
    setBusy(true,T("Recarregando…"));
    loadData().then(function(){ setStatus(); route(); setBusy(false);
      toast(S.demo ? T("Prévia: na versão instalada este botão busca dados novos.") : T("Dados recarregados. O app se atualiza sozinho de hora em hora; para buscar na hora, ative a atualização com um toque em Ajustes."));
    }).catch(function(){ setBusy(false); toast(T("Sem conexão. Tente de novo em instantes.")); });
    return;
  }
  setBusy(true,T("Buscando jogos…"));
  var started=Date.now();
  gh("").then(function(r){ if(!r.ok) throw r; return r.json(); })
  .then(function(repo){
    return gh("/actions/workflows/atualizar.yml/dispatches",{method:"POST",body:JSON.stringify({ref:repo.default_branch||"main"})});
  }).then(function(r){
    if (r.status!==204) throw r;
    toast(T("Busca iniciada. Leva de 2 a 4 minutos; pode continuar usando o app."));
    poll(started,0);
  }).catch(function(e){
    setBusy(false);
    var st=e&&e.status;
    toast(st===401 ? T("A chave de acesso não foi aceita. Confira em Ajustes.") : st===404||st===403 ? T("Sem permissão para iniciar a atualização. Confira a chave e o repositório em Ajustes.") : T("Não consegui iniciar a busca agora. Tente de novo em instantes."));
  });
}
function poll(started,n){
  if (n>40){ setBusy(false); toast(T("A busca está demorando. Ela continua no GitHub; toque em Atualizar daqui a pouco.")); return; }
  setTimeout(function(){
    gh("/actions/workflows/atualizar.yml/runs?per_page=1").then(function(r){ return r.json(); }).then(function(j){
      var run=j.workflow_runs&&j.workflow_runs[0];
      if (!run || new Date(run.created_at).getTime() < started-60000){ return poll(started,n+1); }
      if (run.status!=="completed"){ setBusy(true, run.status==="queued" ? T("Na fila…") : T("Calculando…")); return poll(started,n+1); }
      if (run.conclusion!=="success"){ setBusy(false); toast(T("A busca terminou com erro. Veja os detalhes em Ajustes > Ver execuções no GitHub.")); return; }
      setBusy(true,T("Publicando…"));
      setTimeout(function(){ loadData().then(function(){ S.months={}; setStatus(); route(); setBusy(false); toast(T("Pronto! Jogos e placares atualizados.")); }); },25000);
    }).catch(function(){ poll(started,n+1); });
  }, n===0 ? 20000 : 12000);
}

   T("Escalações, lesões e motivação não entram no cálculo. É uma estimativa estatística, não uma garantia. Se for apostar, aposte só o que pode perder.")].forEach(function(t){ c4.appendChild(el("p",null,t)); });
  main.appendChild(c4);
  var c5=el("section","card"); c5.appendChild(el("h2",null,T("Privacidade"))); c5.appendChild(el("p",null,T("O app não pede cadastro, não usa rastreadores nem anúncios."))); var ap=el("div","actions"), pl=el("a","btn ghost",T("Ler a política de privacidade")); pl.href="privacidade.html"; ap.appendChild(pl); c5.appendChild(ap); main.appendChild(c5);
}

  .catch(function(){ $("status").textContent=T("Sem conexão"); $("main").appendChild(el("p","empty",T("Não consegui carregar os dados. Confira a internet e toque em Atualizar."))); });

  try{ navigator.serviceWorker.register("sw.js").catch(function(){}); }catch(e){}

/* checagem automática: ao voltar ao app e a cada 10 minutos com ele aberto */
var lastCheck=Date.now();
function stamp(d){ return d ? (d.updated||"")+" "+(d.updated_time||"") : ""; }
function checkNew(silentIfSame){
  if (busy || S.demo || !S.data) return;
  lastCheck=Date.now();
  var before=stamp(S.data), dayChanged=todayBR()!==S.today;
  fetch("data.json?t="+Date.now(),{cache:"no-store"}).then(function(r){ return r.ok?r.json():null; }).then(function(d){
    if (!d) return;
    if (dayChanged){ S.today=todayBR(); S.data=d; S.months={}; setStatus(); route(); liveTick(); return; }
    if (stamp(d)===before) return;
    var t=$("toast"); t.textContent=""; t.hidden=false; clearTimeout(toastT);
    t.appendChild(document.createTextNode(T("Chegaram placares e jogos novos. ")));
    var b=el("button",null,T("Ver agora")); b.type="button";
    b.style.cssText="margin-left:.4rem;border:0;border-radius:8px;padding:.3rem .7rem;font-weight:700;background:#f2c94c;color:#13261d;cursor:pointer";
    b.addEventListener("click",function(){ S.data=d; S.months={}; setStatus(); route(); t.hidden=true; });
    t.appendChild(b);
    toastT=setTimeout(function(){ t.hidden=true; },20000);
  }).catch(function(){});
}
document.addEventListener("visibilitychange",function(){
  if (document.visibilityState==="visible" && (Date.now()-lastCheck>5*60000 || todayBR()!==S.today)) checkNew();
});
setInterval(function(){ if (document.visibilityState==="visible") checkNew(); },10*60000);
})();
</script>
